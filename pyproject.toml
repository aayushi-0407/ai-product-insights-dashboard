[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-product-insights-dashboard"
version = "0.1.0"
description = "Pipeline scaffold for an AI Product Insights Dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Phase 1: Ingestion & Embeddings
    "datasets>=2.20.0",
    "pinecone>=3.0.0",
    "openai>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.18.0",
    "requests>=2.31.0",
    "truststore>=0.10.4",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    # Phase 2: Clustering & Analytics
    "hdbscan>=0.8.33",
    "groq>=0.4.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    # Phase 2b: API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    # Phase 3: RAG & Multi-Agent
    "langgraph>=0.0.1",
    "chromadb>=0.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
